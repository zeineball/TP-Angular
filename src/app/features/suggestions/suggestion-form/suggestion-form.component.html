<div class="form-container">
  <h2>Ajouter une Suggestion</h2>

  <form [formGroup]="suggestionForm" (ngSubmit)="onSubmit()">

    <div class="form-group">
      <label>Titre :</label>
      <input type="text" formControlName="title" class="form-control"
             [ngClass]="{'is-invalid': suggestionForm.get('title')?.invalid && suggestionForm.get('title')?.touched}">

      <div class="error-text" *ngIf="suggestionForm.get('title')?.invalid && suggestionForm.get('title')?.touched">
        <small *ngIf="suggestionForm.get('title')?.hasError('required')">Le titre est obligatoire.</small>
        <small *ngIf="suggestionForm.get('title')?.hasError('minlength')">Le titre doit contenir au moins 5 caractères.</small>
        <small *ngIf="suggestionForm.get('title')?.hasError('pattern')">Le titre doit commencer par une majuscule et ne contenir que des lettres.</small>
      </div>
    </div>

    <div class="form-group">
      <label>Description :</label>
      <textarea formControlName="description" rows="4" class="form-control"
                [ngClass]="{'is-invalid': suggestionForm.get('description')?.invalid && suggestionForm.get('description')?.touched}"></textarea>

      <div class="error-text" *ngIf="suggestionForm.get('description')?.invalid && suggestionForm.get('description')?.touched">
        <small *ngIf="suggestionForm.get('description')?.hasError('required')">La description est obligatoire.</small>
        <small *ngIf="suggestionForm.get('description')?.hasError('minlength')">La description doit contenir au moins 30 caractères.</small>
      </div>
    </div>

    <div class="form-group">
      <label>Catégorie :</label>
      <select formControlName="category" class="form-control"
              [ngClass]="{'is-invalid': suggestionForm.get('category')?.invalid && suggestionForm.get('category')?.touched}">
        <option value="">-- Sélectionnez une catégorie --</option>
        <option *ngFor="let cat of categories" [value]="cat">{{ cat }}</option>
      </select>

      <div class="error-text" *ngIf="suggestionForm.get('category')?.invalid && suggestionForm.get('category')?.touched">
        <small *ngIf="suggestionForm.get('category')?.hasError('required')">Veuillez sélectionner une catégorie.</small>
      </div>
    </div>

    <div class="form-group">
      <label>Date :</label>
      <input type="text" formControlName="date" readonly class="form-control readonly-input">
    </div>

    <div class="form-group">
      <label>Status :</label>
      <input type="text" formControlName="status" readonly class="form-control readonly-input">
    </div>

    <button type="submit" [disabled]="suggestionForm.invalid" class="submit-btn">
      Soumettre
    </button>

  </form>
</div>
