<div class="details-card">
  <div class="card-header">
    <h2>Suggestion Details</h2>
  </div>

  <div class="card-body">
    <p class="info-text">
      You are currently viewing the details for Suggestion ID:
      <span class="badge">{{ suggestionId }}</span>
    </p>

    <div class="placeholder-content">
      <p><em>(Full suggestion description, author, and date would be displayed here...)</em></p>
    </div>
  </div>

  <div class="card-footer">
    <a routerLink="/suggestions" class="back-link">
      <i class="icon">&larr;</i> Back to List
    </a>
  </div>
</div>
